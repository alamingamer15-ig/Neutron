name: Android build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android CLI and SDK
        uses: premex-ab/setup-android-cli@v1
        with:
          packages: |
            platforms/android-35
            build-tools/35.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Fetch pinned Android-compatible glibc loader
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git binutils
          sh scripts/install-android-glibc.sh apk app/src/main/jniLibs/arm64-v8a
          readelf -h app/src/main/jniLibs/arm64-v8a/libldcustom.so | grep 'Machine:.*AArch64'

      - name: Build offline ARM64 glibc, Wayland and X11 runtime bundle
        run: sh scripts/build-arm64-runtime-bundle.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test guest memory backend
        run: sh core/memory/tests/run_tests.sh

      - name: Test ELF loader integration
        run: sh core/elf/tests/run_tests.sh

      - name: Test x86-64 initial process stack
        run: sh core/process/tests/run_tests.sh

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify ARM64 runtime bundle and native libraries are packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libc\+\+_shared\.so$'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libldcustom\.so$'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/neutron-runtime-arm64\.tar\.gz$'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/neutron-runtime-arm64.tar.gz > /tmp/neutron-runtime-arm64.tar.gz
          tar -tzf /tmp/neutron-runtime-arm64.tar.gz | grep -E '(^|\/)libwayland-client\.so\.0
          tar -tzf /tmp/neutron-runtime-arm64.tar.gz | grep -E '(^|\/)libX11\.so\.6

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neutron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

          tar -tzf /tmp/neutron-runtime-arm64.tar.gz | grep -E '^usr/lib/aarch64-linux-gnu/libX11\.so\.6$'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neutron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neutron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

          tar -tzf /tmp/neutron-runtime-arm64.tar.gz | grep -E '^usr/lib/aarch64-linux-gnu/libX11\.so\.6$'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neutron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
