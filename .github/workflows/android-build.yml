name: Android build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android CLI and SDK
        uses: premex-ab/setup-android-cli@v1
        with:
          packages: |
            platforms/android-35
            build-tools/35.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Fetch pinned Android-compatible glibc loader
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git binutils zip unzip
          sh scripts/install-android-glibc.sh apk app/src/main/jniLibs/arm64-v8a
          readelf -h app/src/main/jniLibs/arm64-v8a/libldcustom.so | grep 'Machine:.*AArch64'

      - name: Build Neutron-specific Termux bootstrap
        run: sh scripts/build-termux-bootstrap.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test guest memory backend
        run: sh core/memory/tests/run_tests.sh

      - name: Test ELF loader integration
        run: sh core/elf/tests/run_tests.sh

      - name: Test x86-64 initial process stack
        run: sh core/process/tests/run_tests.sh

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify Neutron Termux bootstrap is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_ENTRIES="$(mktemp)"
          BOOTSTRAP_ARCHIVE="$(mktemp)"
          BOOTSTRAP_ENTRIES="$(mktemp)"
          trap 'rm -f "$APK_ENTRIES" "$BOOTSTRAP_ARCHIVE" "$BOOTSTRAP_ENTRIES"' EXIT

          unzip -Z1 "$APK" > "$APK_ENTRIES"
          require_apk_entry() {
            local entry="$1"
            if ! grep -Fxq -- "$entry" "$APK_ENTRIES"; then
              echo "::error::APK is missing required entry: $entry"
              cat "$APK_ENTRIES"
              exit 1
            fi
          }

          require_apk_entry "lib/arm64-v8a/libc++_shared.so"
          require_apk_entry "lib/arm64-v8a/libldcustom.so"
          require_apk_entry "assets/neutron-bootstrap-arm64.zip"

          unzip -p "$APK" assets/neutron-bootstrap-arm64.zip > "$BOOTSTRAP_ARCHIVE"
          test -s "$BOOTSTRAP_ARCHIVE"
          unzip -Z1 "$BOOTSTRAP_ARCHIVE" > "$BOOTSTRAP_ENTRIES"
          for entry in SYMLINKS.txt bin/bash bin/pkg bin/apt-get bin/dpkg bin/ls bin/tar etc/apt/sources.list var/lib/dpkg/status; do
            if ! grep -Fxq -- "$entry" "$BOOTSTRAP_ENTRIES"; then
              echo "::error::Termux bootstrap is missing required entry: $entry"
              cat "$BOOTSTRAP_ENTRIES"
              exit 1
            fi
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neutron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
