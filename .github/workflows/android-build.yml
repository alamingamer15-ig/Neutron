name: Android build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android CLI and SDK
        uses: premex-ab/setup-android-cli@v1
        with:
          packages: |
            platforms/android-35
            build-tools/35.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Fetch pinned Android-compatible glibc loader
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git binutils
          sh scripts/install-android-glibc.sh apk app/src/main/jniLibs/arm64-v8a
          readelf -h app/src/main/jniLibs/arm64-v8a/libldcustom.so | grep 'Machine:.*AArch64'

      - name: Build offline ARM64 glibc, Wayland and X11 runtime bundle
        run: sh scripts/build-arm64-runtime-bundle.sh

      - name: Build Neutron ARM64 bootstrap
        run: sh scripts/build-arm64-runtime-bundle.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test guest memory backend
        run: sh core/memory/tests/run_tests.sh

      - name: Test ELF loader integration
        run: sh core/elf/tests/run_tests.sh

      - name: Test x86-64 initial process stack
        run: sh core/process/tests/run_tests.sh

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify ARM64 runtime bundle and native libraries are packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_ENTRIES="$(mktemp)"
          RUNTIME_ARCHIVE="$(mktemp)"
          RUNTIME_ENTRIES="$(mktemp)"
          trap 'rm -f "$APK_ENTRIES" "$RUNTIME_ARCHIVE" "$RUNTIME_ENTRIES"' EXIT

          # Use unzip's name-only listing instead of parsing the formatted
          # columns from "unzip -l".
          unzip -Z1 "$APK" > "$APK_ENTRIES"
          require_apk_entry() {
            local entry="$1"
            if ! grep -Fxq -- "$entry" "$APK_ENTRIES"; then
              echo "::error::APK is missing required entry: $entry"
              echo "APK entries:"
              cat "$APK_ENTRIES"
              exit 1
            fi
            echo "Verified APK entry: $entry"
          }

          require_apk_entry "lib/arm64-v8a/libc++_shared.so"
          require_apk_entry "lib/arm64-v8a/libldcustom.so"
          require_apk_entry "assets/neutron-runtime-arm64.tar"
          require_apk_entry "assets/neutron-bootstrap-arm64.tar"

          unzip -p "$APK" assets/neutron-bootstrap-arm64.tar > "$RUNTIME_ARCHIVE"
          test -s "$RUNTIME_ARCHIVE"
          tar -tf "$RUNTIME_ARCHIVE" > "$RUNTIME_ENTRIES"
          for entry in bin/pkg bin/bash bin/apt-get bin/dpkg usr/bin/bash usr/bin/apt-get usr/bin/dpkg usr/bin/ls usr/bin/tar etc/apt/sources.list var/lib/dpkg/status; do
            if ! grep -Fxq -- "$entry" "$RUNTIME_ENTRIES"; then
              echo "::error::Neutron bootstrap is missing required entry: $entry"
              cat "$RUNTIME_ENTRIES"
              exit 1
            fi
            echo "Verified bootstrap entry: $entry"
          done

          unzip -p "$APK" assets/neutron-runtime-arm64.tar > "$RUNTIME_ARCHIVE"
          test -s "$RUNTIME_ARCHIVE"
          tar -tf "$RUNTIME_ARCHIVE" > "$RUNTIME_ENTRIES"

          unzip -p "$APK" assets/neutron-runtime-arm64.tar > "$RUNTIME_ARCHIVE"
          test -s "$RUNTIME_ARCHIVE"
          tar -tf "$RUNTIME_ARCHIVE" > "$RUNTIME_ENTRIES"

          require_runtime_entry() {
            local entry="$1"
            if ! grep -Fxq -- "$entry" "$RUNTIME_ENTRIES"; then
              echo "::error::ARM64 runtime archive is missing required entry: $entry"
              echo "Runtime archive entries:"
              cat "$RUNTIME_ENTRIES"
              exit 1
            fi
            echo "Verified runtime entry: $entry"
          }

          require_runtime_entry "usr/lib/aarch64-linux-gnu/libwayland-client.so.0"
          require_runtime_entry "usr/lib/aarch64-linux-gnu/libX11.so.6"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neutron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
