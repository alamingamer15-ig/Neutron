plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.alamingamer15ig.neutron'
    compileSdk 35
    ndkVersion '27.2.12479018'

    // The CI workflow generates the offline ARM64 runtime bundle before Gradle
    // runs. Register that generated directory explicitly as an APK asset source.
    sourceSets {
        main {
            assets.srcDir("$buildDir/generated/neutronAssets")
        }
    }

    defaultConfig {
        applicationId 'io.github.alamingamer15ig.neutron'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    // Termux's reusable terminal UI and emulator (Apache-2.0 libraries).
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
}
